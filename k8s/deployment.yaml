apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-githeal-backend
  namespace: ai-githeal

spec:
  replicas: 2

  selector:
    matchLabels:
      app: ai-githeal-backend

  template:
    metadata:
      labels:
        app: ai-githeal-backend

    spec:
      containers:
        - name: backend
          image: ai-githeal-backend:1.0

          ports:
            - containerPort: 5000

          env:
            - name: ENVIRONMENT
              value: "kubernetes"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20