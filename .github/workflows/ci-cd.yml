name: AI-GitHeal CI/CD

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:

  test:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: app/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python application
        working-directory: app/backend
        run: |
          python -m py_compile app.py


  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        working-directory: app/backend
        run: |
          docker build -t ragini4505/ai-githeal-backend:${{ github.sha }} .
          docker tag ragini4505/ai-githeal-backend:${{ github.sha }} ragini4505/ai-githeal-backend:latest

      - name: Push Docker image
        run: |
          docker push ragini4505/ai-githeal-backend:${{ github.sha }}
          docker push ragini4505/ai-githeal-backend:latest

      - name: Verify Docker image
        run: |
          docker images ragini4505/ai-githeal-backend